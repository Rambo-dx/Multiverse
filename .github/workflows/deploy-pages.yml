name: Deploy MULTIVERSE PWA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        shell: bash
        run: |
          rm -rf site
          mkdir -p site
          if [ -f MULTIVERSE-v1.80-RC1-PWA.zip ]; then
            unzip -q MULTIVERSE-v1.80-RC1-PWA.zip -d site
            python scripts/patch_rc3.py site
          else
            cat > site/index.html <<'HTML'
          <!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#0a0a0d;color:#efe6cd;font:18px system-ui;display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px}b{color:#ffcf4d}</style><body><div><b>MULTIVERSE</b><br><br>Repositorio preparado.<br>Falta subir <code>MULTIVERSE-v1.80-RC1-PWA.zip</code>.</div></body></html>
          HTML
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
